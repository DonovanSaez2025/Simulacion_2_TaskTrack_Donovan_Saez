<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTrack - Modificar Tarea</title>
    <!-- Bootstrap Style -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white py-3">
                <h3 class="card-title h5 mb-0 fw-bold">✏️ Modificar Tarea #{{ tarea.id_tarea }}</h3>
            </div>
            <div class="card-body p-4">
                
                {% with messages = get_flashed_messages(category_filter=['tarea']) %}
                    {% if messages %}
                        <div class="alert alert-danger" role="alert">
                            <ul class="mb-0 small">
                            {% for msg in messages %}
                                <li>{{ msg }}</li>
                            {% endfor %}
                            </ul>
                        </div>
                    {% endif %}
                {% endwith %}

                <form action="/tareas/actualizar/{{ tarea.id_tarea }}" method="POST">
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">Título de la Tarea</label>
                        <input type="text" name="titulo" id="titulo" class="form-control" value="{{ tarea.titulo }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="id_categoria" class="form-label fw-semibold">Categoría</label>
                            <select name="id_categoria" id="id_categoria" class="form-select" required>
                                {% for cat in categorias %}
                                    <option value="{{ cat.id_categoria }}" {% if cat.id_categoria == tarea.id_categoria %}selected{% endif %}>
                                        {{ cat.nombre_categoria }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="id_prioridad" class="form-label fw-semibold">Prioridad</label>
                            <select name="id_prioridad" id="id_prioridad" class="form-select" required>
                                {% for prio in prioridades %}
                                    <option value="{{ prio.id_prioridad }}" {% if prio.id_prioridad == tarea.id_prioridad %}selected{% endif %}>
                                        {{ prio.nombre_prioridad }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="fecha_limite" class="form-label fw-semibold">Fecha Límite</label>
                        <input type="date" name="fecha_limite" id="fecha_limite" class="form-control" value="{{ tarea.fecha_limite.strftime('%Y-%m-%d') }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="desc_tarea" class="form-label fw-semibold">Descripción del Trabajo</label>
                        <textarea name="desc_tarea" id="desc_tarea" rows="4" class="form-control" required>{{ tarea.desc_tarea }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a href="/dashboard" class="btn btn-light border me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4 fw-bold">Actualizar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
